<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan CSS</title>
    <style>
        p{
            font-family: Georgia, 'Times New Roman', Times, serif;
            color: blue;
            font-weight: 500;
        }
        .momo{
            font-style: italic;
            color: #972828;
            font-family: 'Courier New', Courier, monospace;
        }
        .nana{
            font-size: 50px;
        }
    </style>
</head>
<body>
    <p style="font-weight: bold; color: red;">Ini adalah kalimat pertama.</p>
    <p>Ini adalah kalimat kedua.</p>
    <p class="momo">Ini adalah kalimat ketiga.</p>
    <p class="nana">Ini adalah kalimat keempat.</p>
</body>
</html>
